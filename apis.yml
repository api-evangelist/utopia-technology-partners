description: Utopia Technology Partners, Inc. was a help desk software and IT support
  services company based in Larkspur, California, backed by Battery Ventures (listed
  as an exited investment). It was acquired by Royalblue Group plc of Woking, UK on
  May 11, 1998, expanding Royalblue's US help desk operation to the West Coast. The
  company is defunct - its California corporate registration is suspended and it
  publishes no website, developer portal, or API surface.
